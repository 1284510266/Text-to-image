<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 文字生图</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --bg:#0a0a0f;
    --surface:#12121a;
    --border:#1e1e2e;
    --text:#e4e4ef;
    --text-dim:#8888a0;
    --accent:#6c5ce7;
    --accent-glow:rgba(108,92,231,.35);
    --radius:14px;
    --success:#22c55e;
    --error:#ef4444;
  }

  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  header{
    width:100%;max-width:860px;
    padding:48px 24px 0;
    text-align:center;
  }
  header h1{
    font-size:clamp(1.6rem,4vw,2.4rem);
    font-weight:700;
    letter-spacing:-.03em;
    background:linear-gradient(135deg,#a78bfa,#6c5ce7,#38bdf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  header p{margin-top:8px;color:var(--text-dim);font-size:.95rem}

  .input-area{
    width:100%;max-width:860px;
    padding:32px 24px 0;
    display:flex;gap:12px;
  }
  textarea{
    flex:1;resize:none;height:56px;
    padding:16px 18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    color:var(--text);font-size:1rem;font-family:inherit;
    outline:none;transition:border .2s,box-shadow .2s;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
  textarea::placeholder{color:var(--text-dim)}

  .btn{
    height:56px;min-width:120px;padding:0 28px;
    border:none;border-radius:var(--radius);
    background:linear-gradient(135deg,#6c5ce7,#a78bfa);
    color:#fff;font-size:1rem;font-weight:600;
    cursor:pointer;white-space:nowrap;
    transition:transform .15s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--accent-glow)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}

  .options{
    width:100%;max-width:860px;
    padding:16px 24px 0;display:flex;gap:16px;flex-wrap:wrap;
  }
  .opt-group{display:flex;align-items:center;gap:6px}
  .opt-group label{font-size:.82rem;color:var(--text-dim)}
  .opt-group select{
    padding:6px 10px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-size:.82rem;outline:none;
  }

  /* Status bar */
  .status{
    width:100%;max-width:860px;
    padding:12px 24px 0;
    font-size:.85rem;
    min-height:28px;
  }
  .status .msg{display:inline-flex;align-items:center;gap:6px}
  .status .msg.loading{color:var(--accent)}
  .status .msg.ok{color:var(--success)}
  .status .msg.err{color:var(--error)}

  .gallery{
    width:100%;max-width:860px;
    padding:24px 24px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    animation:fadeUp .45s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  .card img{
    width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#181825;
  }
  .card .prompt-text{
    padding:12px 14px;font-size:.82rem;color:var(--text-dim);
    line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .actions{
    position:absolute;top:10px;right:10px;
    display:flex;gap:6px;opacity:0;transition:opacity .2s;
  }
  .card:hover .actions{opacity:1}
  .card .actions button{
    width:34px;height:34px;border:none;border-radius:8px;
    background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
    color:#fff;font-size:.9rem;cursor:pointer;
    display:grid;place-items:center;transition:background .15s;
  }
  .card .actions button:hover{background:rgba(108,92,231,.7)}

  .loading-overlay{
    position:absolute;inset:0;
    background:rgba(10,10,15,.82);
    display:flex;flex-direction:column;gap:12px;
    align-items:center;justify-content:center;
    z-index:2;
  }
  .spinner{
    width:36px;height:36px;
    border:3px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-overlay .progress{font-size:.8rem;color:var(--text-dim)}

  .empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-dim)}
  .empty .icon{font-size:3rem;margin-bottom:12px}

  @media(max-width:560px){
    .input-area{flex-direction:column}
    .btn{width:100%}
    .gallery{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <h1>✨ AI 文字生图</h1>
  <p>输入描述，一键生成 AI 图片</p>
</header>

<div class="input-area">
  <textarea id="prompt" placeholder="描述你想生成的图片，例如：一只穿着宇航服的柴犬在月球上散步，赛博朋克风格" rows="2"></textarea>
  <button class="btn" id="btnGenerate">生成图片</button>
</div>

<div class="options">
  <div class="opt-group">
    <label>尺寸</label>
    <select id="optSize">
      <option value="1024x1024">1:1 方形</option>
      <option value="1024x768">4:3 横版</option>
      <option value="768x1024">3:4 竖版</option>
      <option value="1280x720">16:9 宽屏</option>
    </select>
  </div>
  <div class="opt-group">
    <label>风格</label>
    <select id="optStyle">
      <option value="">自动</option>
      <option value="realistic">写实</option>
      <option value="anime">动漫</option>
      <option value="oil painting">油画</option>
      <option value="watercolor">水彩</option>
      <option value="pixel art">像素风</option>
      <option value="3d render">3D 渲染</option>
      <option value="minimalist">极简</option>
      <option value="cyberpunk">赛博朋克</option>
    </select>
  </div>
</div>

<div class="status" id="status"></div>

<div class="gallery" id="gallery">
  <div class="empty">
    <div class="icon">🎨</div>
    <p>输入文字描述，开始创作吧</p>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const btn = $('#btnGenerate');
const textarea = $('#prompt');
const gallery = $('#gallery');
const optSize = $('#optSize');
const optStyle = $('#optStyle');
const statusEl = $('#status');

let generating = false;

textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 160) + 'px';
});

textarea.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); btn.click(); }
});

function setStatus(text, type) {
  const icons = { loading: '⏳', ok: '✅', err: '❌' };
  statusEl.innerHTML = `<span class="msg ${type}">${icons[type] || ''} ${text}</span>`;
}

async function generate() {
  const text = textarea.value.trim();
  if (!text || generating) { textarea.focus(); return; }

  generating = true;
  btn.disabled = true;
  setStatus('正在生成中，请稍候…（首次可能需要 10-30 秒）', 'loading');

  const [w, h] = optSize.value.split('x');
  const style = optStyle.value;
  const fullPrompt = style ? `${text}, ${style} style` : text;
  const seed = Math.floor(Math.random() * 999999);

  // Remove empty state
  const empty = gallery.querySelector('.empty');
  if (empty) empty.remove();

  // Create card
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="loading-overlay">
      <div class="spinner"></div>
      <div class="progress">生成中…</div>
    </div>
    <img alt="${escHtml(text)}" />
    <div class="prompt-text">${escHtml(text)}</div>
    <div class="actions">
      <button title="下载" onclick="downloadImg(this)">⬇</button>
      <button title="放大" onclick="openFull(this)">🔍</button>
    </div>`;
  gallery.prepend(card);

  const img = card.querySelector('img');
  const overlay = card.querySelector('.loading-overlay');
  const progressEl = card.querySelector('.loading-overlay .progress');

  // Progress timer
  let elapsed = 0;
  const timer = setInterval(() => {
    elapsed += 2;
    progressEl.textContent = elapsed < 10
      ? '连接 AI 引擎…'
      : elapsed < 20
        ? '图像生成中…'
        : '快好了，请再等一下…';
  }, 2000);

  try {
    // Use fetch to get the image via our proxy
    const proxyUrl = `/api/generate?prompt=${encodeURIComponent(fullPrompt)}&width=${w}&height=${h}&seed=${seed}`;
    const resp = await fetch(proxyUrl);

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    const blob = await resp.blob();
    const objectUrl = URL.createObjectURL(blob);

    img.onload = () => {
      overlay.remove();
      URL.revokeObjectURL(objectUrl);
    };
    img.src = objectUrl;

    setStatus('图片生成成功！', 'ok');
    textarea.value = '';
    textarea.style.height = 'auto';
  } catch (err) {
    console.error('Generate error:', err);
    overlay.innerHTML = `
      <span style="color:var(--error);font-size:.85rem;text-align:center;padding:16px">
        生成失败<br><small style="color:var(--text-dim)">${escHtml(err.message)}</small><br>
        <small style="color:var(--accent);cursor:pointer;margin-top:8px;display:inline-block" onclick="location.reload()">点击刷新重试</small>
      </span>`;
    setStatus('生成失败，请检查网络后重试', 'err');
  } finally {
    clearInterval(timer);
    generating = false;
    btn.disabled = false;
  }
}

btn.addEventListener('click', generate);

function downloadImg(el) {
  const img = el.closest('.card').querySelector('img');
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'ai-image-' + Date.now() + '.png';
  a.click();
}

function openFull(el) {
  window.open(el.closest('.card').querySelector('img').src, '_blank');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

</body>
</html>
